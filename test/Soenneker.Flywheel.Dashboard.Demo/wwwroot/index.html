<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flywheel</title>
    <base href="/" />

    <script>
        (() => {
            let preference;
            try { preference = localStorage.getItem("quark-theme"); } catch { }
            const dark = preference === "dark" || (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.classList.toggle("dark", dark);
            document.documentElement.style.colorScheme = dark ? "dark" : "light";
        })();
    </script>
    <script type="module">
        import { initialize } from "./_content/Soenneker.Quark.Suite/js/themeinterop.js";
        initialize();
    </script>
    <link href="css/quark-tailwind.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
</head>

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui" role="alert">
        <h2 class="error-title">Something went wrong</h2>
        <p class="error-description">Reload the dashboard to continue.</p>
        <a href="" class="reload">Reload dashboard</a>
        <button type="button" class="dismiss" aria-label="Dismiss error">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
                <path d="m6 6 12 12M6 18 18 6" />
            </svg>
        </button>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
