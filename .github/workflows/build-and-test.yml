name: build-and-test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: '5.0.0'

permissions:
  contents: read

env:
  PipelineEnvironment: true
  NUGET_XMLDOC_MODE: skip
  BUILD_VERSION: ${{ inputs.version || '5.0.0' }}
  LibrarianVersion: ${{ vars.LIBRARIAN_VERSION || '4.0.0' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: flywheel
          POSTGRES_PASSWORD: integration-password
          POSTGRES_DB: flywheel
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flywheel -d flywheel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.10
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
      - name: Install WebAssembly publishing tools
        run: dotnet workload install wasm-tools
      - name: Restore solution
        run: dotnet restore Soenneker.Flywheel.Suite.slnx
      - name: Build solution
        run: dotnet build Soenneker.Flywheel.Suite.slnx -c Release --no-restore
      - name: Configure Redis integration test user
        # Librarian uses Lua scripts for document reads and transaction condition checks.
        run: docker exec ${{ job.services.redis.id }} redis-cli ACL SETUSER flywheel-tests on '>integration-password' '~*' '+@all'
      - name: Test all Flywheel projects
        env:
          FLYWHEEL_TEST_REDIS: localhost:6379,user=flywheel-tests,password=integration-password
          FLYWHEEL_TEST_POSTGRES: Host=localhost;Port=5432;Username=flywheel;Password=integration-password;Database=flywheel
        shell: bash
        run: |
          set -euo pipefail
          for component in Core Redis Postgres Memory Filesystem Generators Dashboard; do
            dotnet test --project "test/Soenneker.Flywheel.$component.Tests/Soenneker.Flywheel.$component.Tests.csproj" -c Release --no-build --no-restore
          done
      - name: Publish the hosted demo
        run: dotnet publish test/Soenneker.Flywheel.Demo -c Release --no-build --no-restore -o artifacts/demo
      - name: Pack separate NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          for component in Communication Core Redis Postgres Memory Filesystem Generators Dashboard; do
            dotnet pack "src/Soenneker.Flywheel.$component/Soenneker.Flywheel.$component.csproj" -c Release --no-build --no-restore -o artifacts/packages
          done
      - uses: actions/upload-artifact@v7
        with:
          name: flywheel-packages
          path: artifacts/packages/*
          if-no-files-found: error
