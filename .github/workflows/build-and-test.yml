name: build-and-test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: '5.0.0'

permissions:
  contents: read

env:
  PipelineEnvironment: true
  NUGET_XMLDOC_MODE: skip
  BUILD_VERSION: ${{ inputs.version || '5.0.0' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install WebAssembly publishing tools
        run: dotnet workload install wasm-tools
      - name: Restore solution
        run: dotnet restore Soenneker.Flywheel.Suite.slnx
      - name: Build solution
        run: dotnet build Soenneker.Flywheel.Suite.slnx -c Release --no-restore
      - name: Test all Flywheel projects
        env:
          FLYWHEEL_TEST_REDIS: localhost:6379
        shell: bash
        run: |
          set -euo pipefail
          for component in Core Redis Generators Dashboard; do
            dotnet test --project "test/Soenneker.Flywheel.$component.Tests/Soenneker.Flywheel.$component.Tests.csproj" -c Release --no-build --no-restore
          done
      - name: Publish the hosted demo
        run: dotnet publish test/Soenneker.Flywheel.Demo -c Release --no-build --no-restore -o artifacts/demo
      - name: Pack separate NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          for component in Communication Core Redis Generators Dashboard; do
            dotnet pack "src/Soenneker.Flywheel.$component/Soenneker.Flywheel.$component.csproj" -c Release --no-build --no-restore -o artifacts/packages
          done
      - uses: actions/upload-artifact@v4
        with:
          name: flywheel-packages
          path: artifacts/packages/*
          if-no-files-found: error
