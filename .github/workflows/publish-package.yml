name: publish-package

on:
  push:
    branches: [main]
    paths-ignore:
      - 'test/Soenneker.Flywheel.Redis.Tests/Benchmarks/**'
  workflow_dispatch:

# Finish a release before starting another; do not cancel partially published packages.
concurrency:
  group: flywheel-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/build-and-test.yml
    with:
      version: 5.0.${{ github.run_number }}
  deploy:
    permissions:
      contents: read
      id-token: write
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [Communication, Core, Redis, Postgres, Memory, Filesystem, Generators, Dashboard]
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
      - uses: actions/download-artifact@v8
        with:
          name: flywheel-packages
          path: artifacts
      - name: Log in to NuGet
        uses: soenneker/nuget-resilient-login@v3
        id: nuget-login
        with:
          user: soenneker

      - name: Deploy ${{ matrix.package }} to NuGet
        uses: soenneker/nuget-resilient-publish@v2
        with:
          api-key: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          packages: 'artifacts/Soenneker.Flywheel.${{ matrix.package }}.5.0.${{ github.run_number }}.nupkg'

      - name: Deploy ${{ matrix.package }} to GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GH__TOKEN }}
          PACKAGE: Soenneker.Flywheel.${{ matrix.package }}.5.0.${{ github.run_number }}.nupkg
        run: dotnet nuget push "artifacts/$PACKAGE" --source https://nuget.pkg.github.com/soenneker/index.json --api-key "$GH_TOKEN" --skip-duplicate
  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get release notes from latest commit
        uses: soenneker/release-notes-from-commits@v2

      - uses: actions/download-artifact@v8
        with:
          name: flywheel-packages
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 5.0.${{ github.run_number }}
        run: gh release create "v$VERSION" artifacts/*.nupkg --target "$GITHUB_SHA" --title "v$VERSION" --notes "$PACKAGE_RELEASE_NOTES"
